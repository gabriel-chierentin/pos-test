spring.application.name=postest

# Database Configuration - H2 (Default)
spring.datasource.url=jdbc:h2:mem:postest
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Configuration - PostgreSQL (Uncomment to use local PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/postest
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Note: H2Dialect will be automatically detected. For PostgreSQL, uncomment the lines below and configure accordingly
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.postest=DEBUG

# Delay of steps
terminal.request.step.delay:1000